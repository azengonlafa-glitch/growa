<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สามจอเชื่อมกัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{text-decoration:none}</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#FFF7EE;color:#3B2A20;font-family:'Noto Sans Thai Looped','Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.45;padding:36px 56px;display:flex;flex-direction:column;gap:24px;overflow:hidden">

  <div style="text-align:center">
    <h1 style="margin:0;font-family:'Mitr',sans-serif;font-weight:500;font-size:36px">ลูกสั่ง เภสัชกรตรวจ แม่ได้ยา</h1>
    <p style="margin:4px 0 0;color:#6F5A4C;font-size:18px">สามคน สามหน้าจอ เห็นสถานะเดียวกันแบบเรียลไทม์</p>
  </div>

  <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:20px">

    <!-- ลูกสาว -->
    <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:300px;height:560px;box-sizing:border-box;background:#FFF7EE;border:6px solid #3B2A20;border-radius:40px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
        <strong style="font-family:'Mitr',sans-serif;font-weight:500;font-size:20px">คำสั่งซื้อ #Wr0uDX</strong>
        <div style="background:#FFEDC2;border-radius:22px;padding:12px 14px">
          <span style="font-size:13px;font-weight:700;color:#6B4500">ตอนนี้</span>
          <div style="font-family:'Mitr',sans-serif;font-weight:500;font-size:20px;line-height:1.3">เภสัชกรกำลังตรวจแพ้ยา</div>
        </div>
        <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px">
          <li style="display:flex;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:50%;background:#3F7D5C;color:#FFFFFF;display:grid;place-items:center;font-size:12px">✓</span>ส่งคำขอแล้ว</li>
          <li style="display:flex;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:50%;background:#3F7D5C;color:#FFFFFF;display:grid;place-items:center;font-size:12px">✓</span>ร้านยืนยันว่ามียา</li>
          <li style="display:flex;gap:8px;align-items:center;font-weight:700"><span style="width:22px;height:22px;border-radius:50%;background:#F2B24B;box-shadow:0 0 0 2px #FFEDC2"></span>เภสัชกรตรวจแพ้ยา</li>
          <li style="display:flex;gap:8px;align-items:center;color:#6F5A4C"><span style="width:22px;height:22px;border-radius:50%;border:2px solid #9A7F66;box-sizing:border-box"></span>ชำระเงิน (จำลอง)</li>
          <li style="display:flex;gap:8px;align-items:center;color:#6F5A4C"><span style="width:22px;height:22px;border-radius:50%;border:2px solid #9A7F66;box-sizing:border-box"></span>ได้รับยา</li>
        </ol>
        <div style="margin-top:auto;background:#E3F1E8;color:#245A3E;border-radius:16px;padding:10px 12px;font-size:13px">ยังไม่เก็บเงินจนกว่าเภสัชกรจะอนุมัติ</div>
      </div>
      <figcaption style="font-weight:700;font-size:17px">ลูกสาว ผู้สั่งแทน</figcaption>
    </figure>

    <div aria-hidden="true" style="width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#A83F1A;font-weight:700;font-size:13px"><svg width="64" height="24" viewBox="0 0 64 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h54M48 4l10 8-10 8"/></svg>ส่งคำขอ</div>

    <!-- เภสัชกร -->
    <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:460px;height:430px;box-sizing:border-box;background:#FFFCF8;border:6px solid #3B2A20;border-radius:20px;overflow:hidden;display:flex;flex-direction:column">
        <div style="padding:10px 16px;border-bottom:1.5px solid #EADBC8;font-family:'Mitr',sans-serif;font-size:17px;display:flex;justify-content:space-between"><span>ร้านยาเมดิลิงก์ (ร้านจำลอง)</span><span style="font-family:'Noto Sans Thai Looped',sans-serif;font-size:13px;color:#6F5A4C">ภก. ทดสอบ</span></div>
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          <div style="background:#FDE6D8;border-radius:18px;padding:10px 14px;font-size:14px"><strong style="color:#A83F1A">ผู้ป่วย: คุณแม่ 68 ปี</strong><br>แพ้ยา penicillin (ผื่น) · ความดันโลหิตสูง<br>ยาที่ใช้อยู่: เมทฟอร์มิน, ซิมวาสแตติน</div>
          <div style="border:3px solid #B8461F;border-radius:18px;padding:10px 14px;font-size:15px"><strong>#Wr0uDX</strong> แอมโลดิปีน 5 มก. × 1<br><span style="font-size:13px;color:#6F5A4C">เติมยาประจำ · ลูกสาวเป็นผู้ขอ</span></div>
          <div style="display:flex;gap:8px"><span style="flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;background:#3F7D5C;color:#FFFFFF;font-weight:700">อนุมัติให้จ่ายยา</span><span style="display:inline-flex;align-items:center;padding:0 14px;min-height:46px;border-radius:999px;border:2px solid #B93A3A;color:#9E2B2B;font-weight:600;font-size:14px">ไม่อนุมัติ</span></div>
        </div>
      </div>
      <figcaption style="font-weight:700;font-size:17px">เภสัชกร ตรวจแล้วกดอนุมัติ</figcaption>
    </figure>

    <div aria-hidden="true" style="width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#245A3E;font-weight:700;font-size:13px"><svg width="64" height="24" viewBox="0 0 64 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h54M48 4l10 8-10 8"/></svg>แจ้งเตือนทันที</div>

    <!-- คุณแม่ -->
    <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="width:300px;height:560px;box-sizing:border-box;background:#FFF7EE;border:6px solid #3B2A20;border-radius:40px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px"><svg width="46" height="46" viewBox="0 0 64 64" role="img" aria-label="มาสคอต"><g transform="rotate(-28 32 32)"><rect x="17" y="3" width="30" height="58" rx="15" fill="#FFFCF8" stroke="#3B2A20" stroke-width="2.5"/><path d="M17 30V18a15 15 0 0 1 30 0v12z" fill="#F0916A"/><path d="M17 30h30" stroke="#3B2A20" stroke-width="2.5"/><circle cx="26" cy="42" r="2.4" fill="#3B2A20"/><circle cx="38" cy="42" r="2.4" fill="#3B2A20"/><path d="M28 48q4 4 8 0" fill="none" stroke="#3B2A20" stroke-width="2.2" stroke-linecap="round"/></g></svg><strong style="font-family:'Mitr',sans-serif;font-weight:500;font-size:22px;line-height:1.2">สวัสดีค่ะ<br>คุณแม่</strong></div>
        <div style="background:#E3F1E8;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:14px;font-weight:700;color:#245A3E">เภสัชกรอนุมัติแล้ว</span>
          <div style="font-family:'Mitr',sans-serif;font-weight:500;font-size:22px;line-height:1.3;color:#3B2A20">ยาจะจัดส่งถึงบ้าน<br>ภายในวันนี้</div>
        </div>
        <div style="background:#FFFCF8;border:1.5px solid #EADBC8;border-radius:22px;padding:12px 14px;font-size:15px"><strong>ยามื้อเย็น 18:00</strong><br>เมทฟอร์มิน 500 มก. 1 เม็ด</div>
        <span style="margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;background:#B8461F;color:#FFFFFF;font-weight:700;font-size:18px;box-shadow:0 3px 0 #8F3414">กินแล้ว</span>
      </div>
      <figcaption style="font-weight:700;font-size:17px">คุณแม่ ใช้งานง่าย ตัวใหญ่</figcaption>
    </figure>
  </div>

  <p style="margin:0;text-align:center;font-size:14px;color:#6F5A4C">ภาพจำลองเพื่อการออกแบบ ข้อมูลทั้งหมดเป็นข้อมูลจำลอง</p>
</div>
</x-dc>

</body>
</html>
